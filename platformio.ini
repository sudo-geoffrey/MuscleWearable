; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lilygo-t-display-s3]

lib_deps = 
  lvgl/lvgl@^8.3.11
  adafruit/Adafruit BNO08x@^1.2.5

platform = espressif32
board = lilygo-t-display-s3
framework = arduino
board_build.partitions = partitions.csv
extra_scripts = pre:scripts/generate_wallpaper.py

custom_wallpaper_path = asset/galaxy.png
; Use rgb or bgr. T-Display-S3 ST7789 setups often need bgr for embedded images.
custom_wallpaper_color_order = rgb
custom_low_data_mode = no

build_flags =
    -DLV_USE_DRAW_SW_ASM=0
    ; Set to 1 to boot into the on-screen hardware diagnostics page.
    -DDEBUG_MODE=0
    ; Set to 1 to flip the display and move the hardware button hints to the right edge.
    -DUI_UPSIDE_DOWN=1
    ; Set to 1 to skip embedding the wallpaper and reduce firmware size.
    -DLOW_DATA_MODE=1
